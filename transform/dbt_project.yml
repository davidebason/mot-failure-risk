name: motrisk
version: "0.1.0"
config-version: 2

profile: motrisk

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  motrisk:
    # Tables rather than views: the mart reads them many times, and the sources are 11 GB.
    staging:
      +materialized: table
    # Tables too: each is read by the next model and by its tests, and the training table is
    # downloaded once built.
    intermediate:
      +materialized: table
    marts:
      +materialized: table

vars:
  # Where the Parquet copies of the publisher's files are read from, relative to transform/: the
  # full local copy by default; for the development slice,
  # --vars '{parquet_root: ../data/parquet_slice}'.
  parquet_root: ../data/parquet
  # The bounds past which a value becomes missing in staging (DATA.md, "The vehicle columns,
  # cleaned"; evidence/13). Engine size has its bounds per class, in seeds/engine_size_bounds.csv.
  mileage_max: 900000
  age_max_years: 50
  # Two consecutive tests of a vehicle more than this many weeks apart fall in different slots
  # (DATA.md, "What the model predicts"; evidence/14).
  slot_gap_weeks: 20
  # The first year whose slots are predicted: a slot starting in 2018 serves only as an input
  # (DATA.md, "What the model predicts").
  first_target_year: 2019
