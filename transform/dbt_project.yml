name: motrisk
version: "0.1.0"
config-version: 2

profile: motrisk

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  motrisk:
    # Tables rather than views: the mart reads them many times, and the sources are 11 GB.
    staging:
      +materialized: table

vars:
  # Where the Parquet copies of the publisher's files are read from, relative to transform/: the
  # full local copy by default; for the development slice,
  # --vars '{parquet_root: ../data/parquet_slice}'.
  parquet_root: ../data/parquet
