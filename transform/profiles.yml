# Where dbt builds. Committed because it holds no secret: the warehouse is a local DuckDB file.
# dbt reads this file when it is run from this directory, so every dbt command runs from transform/.
# The path is relative to transform/, and puts the database beside the other derived data.
# The full build runs the same way on the Azure virtual machine, from the container parquet
# downloaded to its disk: DuckDB's azure extension could not get a token through the machine's
# identity to list the container (2026-11-12).
motrisk:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../data/processed/mot.duckdb
      threads: 4
      settings:
        # Lets DuckDB write rows as they come rather than hold them back to keep their order,
        # which keeps memory and temporary files small on the full build.
        preserve_insertion_order: false
